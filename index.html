<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Monetag Ad Reward Web App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Updated Ad Network SDK Script -->
    <script src='//libtl.com/sdk.js' data-zone='11555508' data-sdk='show_11555508'></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #2a2a2a;
            text-align: center;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #0088cc;
        }
        .notice-banner {
            font-size: 13px;
            background-color: #2e7d32;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: inline-block;
            font-weight: 500;
        }
        .user-info {
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            color: #e0e0e0;
        }
        .user-info span {
            color: #0088cc;
            font-weight: bold;
        }
        .stats-grid {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }
        .stat-card {
            background: #252525;
            padding: 12px;
            border-radius: 10px;
            flex: 1;
            border: 1px solid #333;
        }
        .stat-card h4 {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .stat-card p {
            font-size: 18px;
            font-weight: bold;
            color: #0088cc;
        }
        .progress-circle {
            width: 90px;
            height: 90px;
            border: 5px solid #0088cc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
            background: #181818;
        }
        .progress-circle span {
            font-size: 20px;
            font-weight: bold;
            color: #ffcc00;
        }
        .timer-box {
            font-size: 14px;
            margin-bottom: 15px;
            color: #ffcc00;
            display: none;
        }
        .buttons button {
            width: 100%;
            margin: 6px 0;
            padding: 12px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            color: white;
            background: #0088cc;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .buttons button:hover {
            opacity: 0.9;
        }
        .buttons button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        .btn-direct-link {
            background-color: #e65100 !important;
        }
        .btn-withdraw-toggle {
            background-color: #2e7d32 !important;
        }
        .btn-stop {
            background-color: #d32f2f !important;
        }
        .withdraw-section {
            margin-top: 20px;
            display: none;
            padding: 20px;
            background-color: #252525;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: left;
        }
        .withdraw-section h3 {
            color: #ffcc00;
            margin-bottom: 12px;
            font-size: 16px;
            text-align: center;
        }
        .withdraw-section input, .withdraw-section select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1a1a1a;
            color: #fff;
            font-size: 14px;
        }
        .withdraw-section button {
            background-color: #2e7d32;
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #withdraw-status {
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2> Pkriya Ad Reward</h2>
    <div class="notice-banner">      !</div>

    <!-- User Info -->
    <div class="user-info">
        , <span id="user-name"></span>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <h4> </h4>
            <p id="watched-ads">0</p>
        </div>
        <div class="stat-card">
            <h4> </h4>
            <p id="earned-points">0.00</p>
        </div>
    </div>

    <!-- Progress Circle -->
    <div class="progress-circle">
        <span id="ads-progress">0%</span>
    </div>

    <!-- Timer Box -->
    <div class="timer-box" id="timer-box">
            : <b id="timer">15</b> 
    </div>

    <!-- Buttons -->
    <div class="buttons">
        <button id="watch-ad-btn" onclick="watchAd()">Watch Ad</button>
        <button id="direct-link-btn" class="btn-direct-link" onclick="openDirectLink()">High CPM Ad (Direct Link)</button>
        <button id="auto-ad-btn" onclick="startAutoAds()">Auto Show Ads</button>
        <button id="stop-auto-btn" class="btn-stop" style="display:none;" onclick="stopAutoAds()">Stop Auto Ads</button>
        <button class="btn-withdraw-toggle" onclick="toggleWithdrawForm()">Withdraw Points</button>
    </div>

    <!-- Withdraw Section -->
    <div class="withdraw-section" id="withdraw-section">
        <h3>  (Withdraw)</h3>
        <label style="font-size: 12px; color: #ccc;"> :</label>
        <input type="number" id="withdraw-amount" placeholder="  " />
        
        <label style="font-size: 12px; color: #ccc;"> :</label>
        <select id="payment-method">
            <option value="bkash">Bkash</option>
            <option value="nagad">Nagad</option>
            <option value="recharge">Mobile Recharge</option>
        </select>

        <label style="font-size: 12px; color: #ccc;"> :</label>
        <input type="text" id="withdraw-phone" placeholder="017XXXXXXXX" />

        <button onclick="withdrawPoints()"> </button>
        <p id="withdraw-status"></p>
    </div>
</div>

<script>
    const MIN_WITHDRAW_POINTS = 5;
    const ADMIN_USER_ID = "7694112804"; 
    const BOT_TOKEN = "8857836007:AAF7SU9rJlq8kapsn2hQHA4XxLrPczHKzDI"; //   
    const DIRECT_LINK_URL = "https://omg10.com/4/10640762"; //  

    let watchedAdsCount = 0;
    let earnedPoints = 0.00;
    let autoAdInterval;
    let timerInterval;
    let telegramUserName = "User";

    // Initialize Telegram WebApp
    window.addEventListener('DOMContentLoaded', () => {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            const initData = window.Telegram.WebApp.initDataUnsafe;
            if (initData && initData.user) {
                telegramUserName = initData.user.username ? "@" + initData.user.username : (initData.user.first_name || "User");
            }
        }
        document.getElementById("user-name").textContent = telegramUserName;

        // Load saved data
        if (localStorage.getItem('watchedAdsCount')) {
            watchedAdsCount = parseInt(localStorage.getItem('watchedAdsCount'));
            earnedPoints = parseFloat(localStorage.getItem('earnedPoints'));
            updateUI();
        }
    });

    function updateUI() {
        document.getElementById('watched-ads').textContent = watchedAdsCount;
        document.getElementById('earned-points').textContent = earnedPoints.toFixed(2);
        const percentage = Math.min((watchedAdsCount % 100), 100);
        document.getElementById('ads-progress').textContent = `${percentage}%`;
    }

    function triggerAdSDK() {
        if (typeof show_11555508 === 'function') {
            try {
                show_11555508();
            } catch (e) {
                console.log("Ad execution error:", e);
            }
        }
    }

    function startTimer(seconds, callback) {
        let timeLeft = seconds;
        const timerBox = document.getElementById("timer-box");
        const timerText = document.getElementById("timer");
        timerBox.style.display = "block";
        timerText.innerText = timeLeft;

        document.getElementById("watch-ad-btn").disabled = true;
        document.getElementById("direct-link-btn").disabled = true;

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            timerText.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerBox.style.display = "none";
                document.getElementById("watch-ad-btn").disabled = false;
                document.getElementById("direct-link-btn").disabled = false;
                if (callback) callback();
            }
        }, 1000);
    }

    function watchAd() {
        triggerAdSDK();
        addRewardPoints(0.20);
        startTimer(15);
    }

    // High CPM Direct Link Handler (Telegram WebApp link opener)
    function openDirectLink() {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
            window.Telegram.WebApp.openLink(DIRECT_LINK_URL);
        } else {
            window.open(DIRECT_LINK_URL, '_blank');
        }
        addRewardPoints(0.30); //     
        startTimer(15);
    }

    function addRewardPoints(points) {
        watchedAdsCount++;
        earnedPoints += points;
        localStorage.setItem('watchedAdsCount', watchedAdsCount);
        localStorage.setItem('earnedPoints', earnedPoints.toFixed(2));
        updateUI();
    }

    function startAutoAds() {
        document.getElementById('auto-ad-btn').style.display = 'none';
        document.getElementById('stop-auto-btn').style.display = 'block';
        
        watchAd();
        autoAdInterval = setInterval(() => {
            watchAd();
        }, 16000);
    }

    function stopAutoAds() {
        clearInterval(autoAdInterval);
        clearInterval(timerInterval);
        document.getElementById('timer-box').style.display = 'none';
        document.getElementById('watch-ad-btn').disabled = false;
        document.getElementById('direct-link-btn').disabled = false;
        document.getElementById('auto-ad-btn').style.display = 'block';
        document.getElementById('stop-auto-btn').style.display = 'none';
    }

    function toggleWithdrawForm() {
        const sec = document.getElementById('withdraw-section');
        sec.style.display = (sec.style.display === 'block') ? 'none' : 'block';
    }

    function withdrawPoints() {
        const amount = parseFloat(document.getElementById('withdraw-amount').value);
        const paymentMethod = document.getElementById('payment-method').value;
        const phoneNumber = document.getElementById('withdraw-phone').value;
        const statusEl = document.getElementById('withdraw-status');

        if (!amount || amount < MIN_WITHDRAW_POINTS) {
            statusEl.style.color = "orange";
            statusEl.textContent = `  : ${MIN_WITHDRAW_POINTS}`;
            return;
        }

        if (amount > earnedPoints) {
            statusEl.style.color = "red";
            statusEl.textContent = `    : ${earnedPoints.toFixed(2)} `;
            return;
        }

        if (!phoneNumber || phoneNumber.length < 11) {
            statusEl.style.color = "orange";
            statusEl.textContent = "   ";
            return;
        }

        earnedPoints -= amount;
        document.getElementById('earned-points').textContent = earnedPoints.toFixed(2);
        localStorage.setItem('earnedPoints', earnedPoints.toFixed(2));

        const message = ` Withdrawal Request!\n\nUser: ${telegramUserName}\nAmount: ${amount} Points\nMethod: ${paymentMethod.toUpperCase()}\nPhone: ${phoneNumber}`;
        
        sendWithdrawRequestToAdmin(message);

        statusEl.style.color = "#4caf50";
        statusEl.textContent = '    !';

        document.getElementById('withdraw-amount').value = '';
        document.getElementById('withdraw-phone').value = '';
    }

    function sendWithdrawRequestToAdmin(message) {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_USER_ID}&text=${encodeURIComponent(message)}`)
            .then(res => res.json())
            .then(data => console.log('Admin notified:', data))
            .catch(err => console.error('Error sending notify:', err));
    }
</script>

</body>
</html>
